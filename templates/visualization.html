<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentiment Visualizations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    body { background:#f5f7fb; color:#202633; }
    .navbar { background:#182232; }
    .chart-card { background:#fff; border-radius:16px; padding:22px; box-shadow:0 4px 16px rgba(30,45,70,.07); height:100%; }
    .chart-wrap { position:relative; min-height:310px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark"><div class="container">
  <a class="navbar-brand" href="{{ url_for('home') }}">YouTube Sentiment Analyzer</a>
  <div class="navbar-nav ms-auto flex-row gap-3">
    <a class="nav-link" href="{{ url_for('home') }}">New analysis</a>
    <a class="nav-link" href="{{ url_for('wc') }}">Word cloud</a>
    <a class="nav-link" href="{{ url_for('logout') }}">Log out</a>
  </div>
</div></nav>
<main class="container py-4 py-md-5">
  <div class="mb-4"><h1 class="h2">Sentiment visualizations</h1><p class="text-secondary mb-0">Based on {{ n }} comments in your latest analysis.</p></div>
  <div class="row g-4">
    <div class="col-lg-6"><section class="chart-card"><h2 class="h5">Sentiment distribution</h2><div class="chart-wrap"><canvas id="pieChart" aria-label="Pie chart of sentiment distribution"></canvas></div></section></div>
    <div class="col-lg-6"><section class="chart-card"><h2 class="h5">Comment counts</h2><div class="chart-wrap"><canvas id="barChart" aria-label="Bar chart of sentiment counts"></canvas></div></section></div>
  </div>
  <div class="mt-4 d-flex gap-2 flex-wrap"><a class="btn btn-outline-primary" href="{{ url_for('result') }}">Return to results</a><a class="btn btn-primary" href="{{ url_for('home') }}">Analyze another video</a></div>
</main>
<script>
  const counts = [{{ np|int }}, {{ nne|int }}, {{ nn|int }}];
  const labels = ['Positive', 'Neutral', 'Negative'];
  const colors = ['#198754', '#6c757d', '#dc3545'];
  new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: counts, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
  new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Comments', data: counts, backgroundColor: colors, borderRadius: 8 }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }, plugins: { legend: { display: false } } }
  });
</script>
</body>
</html>
